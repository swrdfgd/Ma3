<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma3 (Mathree) - MSC2020</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- Load the separated data file -->
    <script src="data.js"></script>
	<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Verdana', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: #ffffff;
            padding: 1.25rem 2rem;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        header p {
            margin: 0.25rem 0 0 0;
            font-size: 0.9rem;
            color: #64748b;
        }

        #mathree-container {
            flex: 1;
            width: 100%;
            background-color: var(--bg-color);
            cursor: grab;
            position: relative;
        }

        #mathree-container:active {
            cursor: grabbing;
        }

        .link {
            fill: none;
            stroke: #cbd5e1;
            stroke-width: 2px;
        }

        .node circle {
            stroke-width: 2.5px;
        }

        .node text {
            font-family: 'Verdana', sans-serif;
            font-size: 13px;
            text-shadow: 0 1px 3px rgba(255,255,255,0.8);
        }

        .node a text:hover {
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
        }
		
		.node-link:hover {
            text-decoration: underline !important;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ma3 (Mathree) 🌳</h1>
        <p>Mathematics Classification Tree. Drag to pan, scroll to zoom in/out.</p>
    </header>

    <div id="mathree-container"></div>

    <script>
        const container = document.getElementById("mathree-container");
        const innerWidth = 1400; 
        const innerHeight = 800;

        const svg = d3.select("#mathree-container")
            .append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .call(d3.zoom().on("zoom", function (event) {
                g.attr("transform", event.transform);
            }))
            .append("g")
            .attr("transform", "translate(150, 300)");

        const g = svg;
        const treeLayout = d3.tree().size([innerHeight - 200, innerWidth - 400]);
        
        // mscData is loaded from data.js
        const root = d3.hierarchy(mscData, d => d.cabang);
        treeLayout(root);

        g.selectAll(".link")
            .data(root.links())
            .join("path")
            .attr("class", "link")
            .attr("d", d3.linkHorizontal()
                .x(d => d.y)
                .y(d => d.x)
            );

        const node = g.selectAll(".node")
            .data(root.descendants())
            .join("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.y},${d.x})`);

		// 1. BOLA MAINAN PLASTIK (Warna Solid, Shiny & Bisa Diklik)
        // Membungkus bola dengan elemen <a> SVG
        const ballLink = node.append("a")
            .attr("target", "_blank")
            // Hanya tambahkan atribut href jika data link tersedia
            .attr("href", d => (d.data.link && d.data.link.trim() !== "") ? d.data.link : null)
            .style("cursor", d => (d.data.link && d.data.link.trim() !== "") ? "pointer" : "default");

        // Lingkaran dasar diletakkan di dalam tag <a>
        ballLink.append("circle")
            .attr("class", "base-circle")
            .attr("r", 10) 
            .style("fill", d => d.data.warna) 
            .style("stroke", "rgba(0, 0, 0, 0.1)") 
            .style("stroke-width", "1px")
            .style("filter", "drop-shadow(0px 2px 4px rgba(0,0,0,0.2))");

        // Lingkaran pantulan cahaya juga diletakkan di dalam tag <a>
        ballLink.append("circle")
            .attr("class", "highlight-circle")
            .attr("r", 3.5)
            .attr("cx", -3.5)
            .attr("cy", -3.5)
            .style("fill", "rgba(255, 255, 255, 0.75)") 
            .style("stroke", "none")
            .style("pointer-events", "none");

        // 2. LOGIKA TEKS (Termasuk MathJax & Link)
        node.each(function(d) {
            const el = d3.select(this);
            const width = 450; 
            const height = 40;
            
            // Jarak agak dijauhkan karena bola sekarang lebih besar
            const xPos = d.children ? -(width + 18) : 18; 
            const yPos = -20; 

            const foreignObject = el.append("foreignObject")
                .attr("width", width)
                .attr("height", height)
                .attr("x", xPos)
                .attr("y", yPos)
                .style("pointer-events", "none"); // Pointer tembus ke div

            let div = foreignObject.append("xhtml:div")
                .attr("class", "node-text-container") // Class ini dipakai untuk trigger hover di Javascript
                .style("width", "100%")
                .style("height", "100%")
                .style("display", "flex")
                .style("align-items", "center")
                .style("justify-content", d.children ? "flex-end" : "flex-start")
                .style("font-size", "14px")
                .style("font-family", "'Verdana', sans-serif")
                .style("color", d.data.warna)
                .style("white-space", "nowrap")
                .style("pointer-events", "auto") // Mengizinkan pointer menangkap teks
                .style("transform-origin", d.children ? "center right" : "center left") // Penting: agar teks membesar ke arah luar
                .style("transition", "transform 0.2s ease, font-weight 0.2s ease"); // Transisi animasi halus

            if (d.data.link && d.data.link.trim() !== "") {
                div.append("xhtml:a")
                    .attr("href", d.data.link)
                    .attr("target", "_blank")
                    .style("text-decoration", "none")
                    .style("color", "inherit")
                    .attr("class", "node-link") // Ini memicu garis bawah (underline) di CSS
                    .html(d.data.nama);
            } else {
                div.html(d.data.nama); 
            }
        });

        // 3. EVENT HOVER SINKRON (Bola & Teks ikut membesar)
        node.on("mouseenter", function(event, d) {
            const el = d3.select(this);
            
            // Perbesar Bola
            el.select(".base-circle").transition().duration(200)
              .attr("r", 15) // Ukuran bola saat hover
              .style("filter", "drop-shadow(0px 4px 6px rgba(0,0,0,0.3))");
              
            // Geser & Perbesar Pantulan Cahaya
            el.select(".highlight-circle").transition().duration(200)
              .attr("r", 5.5).attr("cx", -5).attr("cy", -5);
              
            // Perbesar & Tebalkan Teks
            el.select(".node-text-container")
              .style("transform", "scale(1.15)") // Skala perbesaran teks
              .style("font-weight", "bold");
        })
        .on("mouseleave", function(event, d) {
            const el = d3.select(this);
            
            // Kembalikan Bola ke normal
            el.select(".base-circle").transition().duration(200)
              .attr("r", 10)
              .style("filter", "drop-shadow(0px 2px 4px rgba(0,0,0,0.15))");
              
            // Kembalikan pantulan
            el.select(".highlight-circle").transition().duration(200)
              .attr("r", 3.5).attr("cx", -3.5).attr("cy", -3.5);
              
            // Kembalikan Teks ke normal
            el.select(".node-text-container")
              .style("transform", "scale(1)")
              .style("font-weight", "normal");
        });
		if (window.MathJax) {
			MathJax.typesetPromise();
		}	
    </script>
</body>
</html>
